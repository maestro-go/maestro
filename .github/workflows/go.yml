name: Go CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# No concurrency/cancel-in-progress: redundant runs are filtered at the trigger
# level (push only on main, PRs cover main/dev), so a push to a PR head branch
# fires a single run instead of a duplicate that would need cancelling.

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -race -coverprofile=cover.out ./...

      - name: Filter out testing utilities from coverage
        run: |
          grep -v "internal/utils/testing" cover.out > cover.filtered.out
          mv cover.filtered.out cover.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover.out
          retention-days: 1

  coverage:
    name: Coverage Check (>70%)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Filter out testing utilities from coverage
        run: |
          grep -v "internal/utils/testing" cover.out > cover.filtered.out
          mv cover.filtered.out cover.out

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          
          if awk "BEGIN {exit !($COVERAGE < 70)}"; then
            echo "::error::Coverage ($COVERAGE%) is below the required 70% threshold"
            exit 1
          else
            echo "::notice::Coverage check passed ($COVERAGE% >= 70%)"
          fi

  typos:
    name: Typos Check (Warnings)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for typos
        uses: crate-ci/typos@master
        continue-on-error: true

      - name: Output warning
        if: failure()
        run: |
          echo "::warning::Typos detected in code. Check the 'Check for typos' step above for details."

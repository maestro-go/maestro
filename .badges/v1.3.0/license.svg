<svg xmlns="http://www.w3.org/2000/svg" width="98" height="20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="98" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="63" height="20" fill="#555"/>
    <rect x="63" width="35" height="20" fill="#7D929E"/>
    <rect width="98" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="31" y="15" fill="#010101" fill-opacity=".3">license</text>
    <text x="31" y="14">license</text>
    <text x="80" y="15" fill="#010101" fill-opacity=".3">MIT</text>
    <text x="80" y="14">MIT</text>
  </g>
</svg>

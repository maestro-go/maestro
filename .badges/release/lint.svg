<svg xmlns="http://www.w3.org/2000/svg" width="168" height="20" role="img" aria-label="golangci-lint: passing">
  <title>golangci-lint: passing</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="168" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="105" height="20" fill="#555"/>
    <rect x="105" width="63" height="20" fill="#28a745"/>
    <rect width="168" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="52" y="15" fill="#010101" fill-opacity=".3">golangci-lint</text>
    <text x="52" y="14">golangci-lint</text>
    <text x="136" y="15" fill="#010101" fill-opacity=".3">passing</text>
    <text x="136" y="14">passing</text>
  </g>
</svg>
